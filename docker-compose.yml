services:
  web-prod-a:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:prod-latest
    container_name: expresspharm-prod-a
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks: [ webnet ]
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  web-prod-b:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:prod-latest
    container_name: expresspharm-prod-b
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks: [ webnet ]
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  web-dev-a:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:dev-latest
    container_name: expresspharm-dev-a
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks: [ webnet ]
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  web-dev-b:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:dev-latest
    container_name: expresspharm-dev-b
    ports:
      - "3003:3000"
    restart: unless-stopped
    networks: [ webnet ]
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

  caddy:
    image: caddy:2.10
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks: [ webnet ]

networks:
  webnet:

volumes:
  caddy_data:
  caddy_config:
