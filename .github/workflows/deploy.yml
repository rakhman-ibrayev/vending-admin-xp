name: Build & Deploy to VPS

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.idea/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.prettierrc*'
      - '.eslintrc*'
      - '*.config.js'
      - '!next.config.js'
      - '.github/**'
      - '!.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'prod-latest' || 'dev-latest' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_PHARMEXPRESS_COMPANY_BIN=${{ vars.NEXT_PUBLIC_PHARMEXPRESS_COMPANY_BIN }}
            NEXT_PUBLIC_VENDING_MACHINE_HEARTBEAT_INTERVAL_MINS=${{ vars.NEXT_PUBLIC_VENDING_MACHINE_HEARTBEAT_INTERVAL_MINS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old GHCR image versions (keep 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Display environment info
        run: |
          echo "Branch name: ${{ github.ref_name }}"
          echo "Deploying tag: $([[ ${{ github.ref_name }} == 'main' ]] && echo 'prod-latest' || echo 'dev-latest')"

      - name: Wait for GHCR image propagation
        run: sleep 10

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -ux
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            
            cd /srv/expresspharm
            
            # Pull latest deployment scripts
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Ensure script is executable
            chmod +x deploy/bluegreen.sh
            
            # Set environment variables for docker-compose
            export REGISTRY=ghcr.io
            export IMAGE_NAME=${{ github.repository }}
            export ENV_DIR=/srv/expresspharm/env
            
            # Ensure Caddy is running
            if ! docker ps | grep -q caddy; then
              echo "Starting Caddy..."
              docker compose up -d caddy
            else
              echo "Restarting Caddy to reload config..."
              docker compose restart caddy
            fi
            
            # Run blue-green deployment
            if [ "${{ github.ref_name }}" = "main" ]; then
              ./deploy/bluegreen.sh prod --skip-confirmation
            else
              ./deploy/bluegreen.sh dev --skip-confirmation
            fi
