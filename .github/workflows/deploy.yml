name: Build & Deploy to VPS

on:
  push:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'prod-latest' || 'dev-latest' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_PHARMEXPRESS_COMPANY_BIN=${{ vars.NEXT_PUBLIC_PHARMEXPRESS_COMPANY_BIN }}
            NEXT_PUBLIC_VENDING_MACHINE_HEARTBEAT_INTERVAL_MINS=${{ vars.NEXT_PUBLIC_VENDING_MACHINE_HEARTBEAT_INTERVAL_MINS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old GHCR image versions (keep 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Display environment info
        run: |
          echo "Branch name: ${{ github.ref_name }}"
          echo "Deploying tag: $([[ ${{ github.ref_name }} == 'main' ]] && echo 'prod-latest' || echo 'dev-latest')"

      - name: Wait for GHCR image propagation
        run: sleep 10

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -ux
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            cd /srv/expresspharm
            
            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose pull web-prod caddy
              docker compose up -d web-prod caddy --remove-orphans
            else
              docker compose pull web-dev caddy
              docker compose up -d web-dev caddy --remove-orphans
            fi
            
            echo "Deployed containers:"
            docker ps --filter "name=expresspharm" --filter "name=caddy"
            
            echo "Recent logs:"
            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose logs --tail=20 web-prod
            else
              docker compose logs --tail=20 web-dev
            fi
            
            docker image prune -f
